AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lab 02 scaffolding - Provisions a new VPC with a public subnet + IGW and a
  Windows Server 2016 EC2 instance reachable via RDP from the deploying
  engineer's own IP. Bruno is silently installed via UserData at first
  boot, so it's ready to go by the time the engineer RDPs in. Engineers
  build out the Bedrock Runtime PrivateLink endpoint and IAM permissions
  themselves as part of the lab.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - VpcName
      - Label:
          default: Network
        Parameters:
          - VpcCidr
          - PublicSubnetCidr
      - Label:
          default: Access
        Parameters:
          - MyIP
          - KeyPairName
      - Label:
          default: Instance
        Parameters:
          - InstanceType
          - RootVolumeSizeGiB
          - LatestWindowsAmiId
      - Label:
          default: Tooling
        Parameters:
          - BrunoVersion
    ParameterLabels:
      VpcName:
        default: VPC Name tag
      MyIP:
        default: Your public IP (CIDR)
      KeyPairName:
        default: EC2 Key Pair for RDP password retrieval

Parameters:
  VpcName:
    Type: String
    Description: >
      Name tag to apply to the VPC and related resources. Pick something
      that identifies you/your lab run, e.g. "jsmith-bedrock-lab".
    MinLength: 1

  VpcCidr:
    Type: String
    Description: CIDR block for the new VPC. Any private range is fine.
    Default: 10.0.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  PublicSubnetCidr:
    Type: String
    Description: CIDR block for the single public subnet (must fall within VpcCidr).
    Default: 10.0.1.0/24
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  MyIP:
    Type: String
    Description: >
      Your current public IP address in CIDR notation (e.g. 203.0.113.5/32).
      RDP (3389) inbound is restricted to this address only. Find yours at
      https://checkip.amazonaws.com and append /32.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR, e.g. 203.0.113.5/32

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: >
      Existing EC2 key pair (in this region) used to decrypt the Windows
      Administrator password after launch.

  InstanceType:
    Type: String
    Description: EC2 instance type for the Windows box.
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
      - m5.large
      - m5.xlarge

  RootVolumeSizeGiB:
    Type: Number
    Description: Size (GiB) of the root EBS volume.
    Default: 50
    MinValue: 30
    MaxValue: 200

  LatestWindowsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: >
      Resolved via the public SSM parameter for the latest Windows Server
      2016 AMI - no need to hunt down an AMI ID by hand.
    Default: /aws/service/ami-windows-latest/Windows_Server-2016-English-Full-Base

  BrunoVersion:
    Type: String
    Description: >
      Bruno version to silently install via UserData at first boot (pinned,
      not "latest", so every engineer gets the same build). Check
      https://github.com/usebruno/bruno/releases for newer versions.
    Default: "4.1.0"

Resources:
  # ---------------------------------------------------------------------
  # Networking
  # ---------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref VpcName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ---------------------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------------------
  RDPSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow RDP from the IP of the deploying engineer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref MyIP
          Description: RDP from deploying engineer
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-rdp-sg

  # ---------------------------------------------------------------------
  # Windows Server 2016 instance
  # ---------------------------------------------------------------------
  WindowsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestWindowsAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref RDPSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-windows-lab
      # Runs once at first boot via EC2Launch (Windows Server 2016 uses
      # EC2Launch v1, not EC2Launch v2). Silently installs Bruno so it's
      # ready to go by the time the engineer RDPs in. Progress/errors are
      # logged to C:\lab-bootstrap.log, and a marker file
      # (C:\lab-bootstrap-complete.txt or -failed.txt) is dropped on the
      # desktop's parent drive so success/failure can be confirmed at a
      # glance without digging through the log.
      UserData:
        Fn::Base64: !Sub |
          <powershell>
          $ErrorActionPreference = "Stop"
          Start-Transcript -Path "C:\lab-bootstrap.log" -Append

          try {
            # Windows Server 2016's .NET Framework defaults to SSL3/TLS1.0
            # for outbound HTTPS, which GitHub (and most modern hosts)
            # reject - causes "Could not create SSL/TLS secure channel."
            # Force TLS 1.2 before making any web requests.
            [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12

            # NOTE: BrunoVersion below is substituted by CloudFormation's
            # Fn::Sub (with the literal parameter value, e.g. 4.1.0)
            # before this script is ever written to the instance - by the
            # time PowerShell parses it, it's plain text, not a variable.
            $msiUrl  = "https://github.com/usebruno/bruno/releases/download/v${BrunoVersion}/bruno_${BrunoVersion}_x64_win.msi"
            $msiPath = "$env:TEMP\bruno-installer.msi"

            Write-Output "Downloading Bruno ${BrunoVersion} from $msiUrl"
            Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath -UseBasicParsing

            Write-Output "Installing Bruno silently"
            $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /quiet /norestart /L*v `"$env:TEMP\bruno-msi.log`"" -Wait -NoNewWindow -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "msiexec exited with code $($proc.ExitCode)"
            }

            Write-Output "Bruno ${BrunoVersion} installed successfully"
            Set-Content -Path "C:\lab-bootstrap-complete.txt" -Value "Bruno ${BrunoVersion} installed at $(Get-Date)"
          }
          catch {
            Write-Output "Bootstrap FAILED: $_"
            Set-Content -Path "C:\lab-bootstrap-failed.txt" -Value "$_"
          }

          Stop-Transcript
          </powershell>

Outputs:
  VpcId:
    Description: ID of the new VPC
    Value: !Ref VPC

  PublicSubnetId:
    Description: ID of the public subnet
    Value: !Ref PublicSubnet

  InstanceId:
    Description: EC2 instance ID of the Windows box
    Value: !Ref WindowsInstance

  InstancePublicIp:
    Description: Public IP address - RDP to this
    Value: !GetAtt WindowsInstance.PublicIp
