AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lab 02 scaffolding - Provisions a new VPC with a public subnet + IGW, a
  Windows Server 2016 EC2 instance reachable via RDP from the deploying
  engineer's own IP, an interface VPC endpoint (PrivateLink) for the Bedrock
  Runtime service, and an instance role scoped to invoke the Amazon Nova
  Lite model. Engineers RDP into the box, install Postman/Bruno, and call
  Bedrock Runtime over the private endpoint instead of the public internet.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - VpcName
      - Label:
          default: Network
        Parameters:
          - VpcCidr
          - PublicSubnetCidr
      - Label:
          default: Access
        Parameters:
          - MyIP
          - KeyPairName
      - Label:
          default: Instance
        Parameters:
          - InstanceType
          - RootVolumeSizeGiB
          - LatestWindowsAmiId
      - Label:
          default: Bedrock
        Parameters:
          - NovaLiteModelId
    ParameterLabels:
      VpcName:
        default: VPC Name tag
      MyIP:
        default: Your public IP (CIDR)
      KeyPairName:
        default: EC2 Key Pair for RDP password retrieval

Parameters:
  VpcName:
    Type: String
    Description: >
      Name tag to apply to the VPC and related resources. Pick something
      that identifies you/your lab run, e.g. "jsmith-bedrock-lab".
    MinLength: 1

  VpcCidr:
    Type: String
    Description: CIDR block for the new VPC. Any private range is fine.
    Default: 10.0.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  PublicSubnetCidr:
    Type: String
    Description: CIDR block for the single public subnet (must fall within VpcCidr).
    Default: 10.0.1.0/24
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  MyIP:
    Type: String
    Description: >
      Your current public IP address in CIDR notation (e.g. 203.0.113.5/32).
      RDP (3389) inbound is restricted to this address only. Find yours at
      https://checkip.amazonaws.com and append /32.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR, e.g. 203.0.113.5/32

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: >
      Existing EC2 key pair (in this region) used to decrypt the Windows
      Administrator password after launch.

  InstanceType:
    Type: String
    Description: EC2 instance type for the Windows box.
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
      - m5.large
      - m5.xlarge

  RootVolumeSizeGiB:
    Type: Number
    Description: Size (GiB) of the root EBS volume.
    Default: 50
    MinValue: 30
    MaxValue: 200

  LatestWindowsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: >
      Resolved via the public SSM parameter for the latest Windows Server
      2016 AMI - no need to hunt down an AMI ID by hand.
    Default: /aws/service/ami-windows-latest/Windows_Server-2016-English-Full-Base

  NovaLiteModelId:
    Type: String
    Description: Bedrock foundation model ID the instance role is allowed to invoke.
    Default: amazon.nova-lite-v1:0

Resources:
  # ---------------------------------------------------------------------
  # Networking
  # ---------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref VpcName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ---------------------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------------------
  RDPSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow RDP from the deploying engineer's IP only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref MyIP
          Description: RDP from deploying engineer
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-rdp-sg

  BedrockEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from the Windows box to the Bedrock Runtime interface endpoint
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref RDPSecurityGroup
          Description: HTTPS from the lab instance
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-bedrock-endpoint-sg

  # ---------------------------------------------------------------------
  # Bedrock Runtime PrivateLink endpoint
  # ---------------------------------------------------------------------
  BedrockRuntimeVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.bedrock-runtime
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref BedrockEndpointSecurityGroup

  # ---------------------------------------------------------------------
  # IAM role for the instance - scoped to invoking Nova Lite only
  # ---------------------------------------------------------------------
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${VpcName}-bedrock-lab-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeNovaLite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${NovaLiteModelId}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  # ---------------------------------------------------------------------
  # Windows Server 2016 instance
  # ---------------------------------------------------------------------
  WindowsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestWindowsAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref RDPSecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-windows-lab

Outputs:
  VpcId:
    Description: ID of the new VPC
    Value: !Ref VPC

  PublicSubnetId:
    Description: ID of the public subnet
    Value: !Ref PublicSubnet

  InstanceId:
    Description: EC2 instance ID of the Windows box
    Value: !Ref WindowsInstance

  InstancePublicIp:
    Description: Public IP address - RDP to this
    Value: !GetAtt WindowsInstance.PublicIp

  BedrockRuntimeEndpointId:
    Description: VPC Endpoint ID for Bedrock Runtime (PrivateLink)
    Value: !Ref BedrockRuntimeVPCEndpoint

  IamRoleName:
    Description: IAM role attached to the instance (scoped to InvokeModel on Nova Lite)
    Value: !Ref EC2InstanceRole
